# Project-wide Gradle settings

org.gradle.jvmargs=-Xmx2048m

# Android Build
android.useAndroidX=true
android.enableJetifier=true

# Kotlin configuration
kotlin.jsir.enabled=true
kotlin.stdlib.default.dependency=false

# Kotlin version
kotlin.version=1.9.23

# Android Gradle Plugin version
android.gradlePluginVersion=8.2.1

# SDK versions
android.minSdkVersion=24
android.targetSdkVersion=34
android.compileSdkVersion=34
android.buildToolsVersion="34.0.0"

# AndroidX support
android.useAndroidX=true
android.enableJetifier=true

# Enable file system caches
fileSystemCache.enabled=true

# Parallel build
org.gradle.parallel=true
org.gradle.workers.max=4

# Configure heap size for daemon
org.gradle.daemon=true
org.gradle.daemon.idleness.timeout=600

# Experimental features
org.gradle.unsafe.projectcache.enabled=true

# Kotlin compiler options
kotlin.compiler.execution.strategy=in-process
kotlin.incremental.multiplatform=true
kotlin.multiplatform.enableCompilationClasspathResilience=true